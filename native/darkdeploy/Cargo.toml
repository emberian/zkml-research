[package]
name = "darkdeploy"
version = "0.1.0"
edition.workspace = true
description = "The deployed dark-learning run: the data owner's process (dl-owner) that feeds the three custodian processes (darkstep serve) over pinned TLS."

[dependencies]
darkstep = { path = "../darkstep" }
darkproof = { path = "../darkproof", features = ["tcp"] }
darkprep = { path = "../darkprep" }
darktrain = { path = "../darktrain" }
pycompat = { path = "../pycompat" }
serde_json = "1"
sha2 = "0.10"

[features]
# TEST ONLY: darkstep's test harness (serve --test-keep-shares, deal-steps)
test-harness = ["darkstep/test-harness"]

[[test]]
name = "prove_steps"
required-features = ["test-harness"]
