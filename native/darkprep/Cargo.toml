[package]
name = "darkprep"
version = "0.1.0"
edition.workspace = true
description = "Real preprocessing for the dark-learning MPC fork: MASCOT via MP-SPDZ, per-party tapes in run_step order."

[dependencies]
pycompat = { path = "../pycompat" }
# only for `darkprep export-darkstep`: the online step's own tape format and the harness inputs
darkstep = { path = "../darkstep" }
libc = "0.2"

[dev-dependencies]
# the release's authority on tag order: darkproof::run::deal_release over darkstep's dealer
darkproof = { path = "../darkproof", features = ["tcp"] }
