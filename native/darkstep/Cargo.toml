[package]
name = "darkstep"
version = "0.1.0"
edition.workspace = true
description = "Native MPC-fork custodians for dark learning: SPDZ online phase, ideal-dealer tapes, BFV (RNS/NTT) HE matvec and HE outer product, three parties over TCP. Bit-exact against research/dark_learning_2026_11_06/native_ref.py."

[features]
# TEST ONLY: seeded ceremony coins and ZKPoPK hiding randomness, for the bit-exact gated test (vs_reference_gated)
test-det = ["dzkpopk/test-det"]
# TEST ONLY: the `deal` (public-seed ideal dealer) and `reveal` (reassembles the shares) subcommands
test-harness = []

[[test]]
name = "vs_reference_gated"
required-features = ["test-det"]

[[test]]
name = "party_coins"
required-features = ["test-harness"]

[[test]]
name = "serve_steps"
required-features = ["test-harness"]

[dependencies]
libc = "0.2"
pycompat = { path = "../pycompat" }
dzkpopk = { path = "../dzkpopk" }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.10"
sha2 = "0.10"
serde_json = "1"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }

[[test]]
name = "relay"
required-features = ["test-harness"]
