[package]
name = "resident_custody"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Durable resident custody and blinded cSHAKE256 byte projections"

[dependencies]
aes = "0.9"
ctr = "0.10"
anyhow = "1"
bincode = "1.3"
blake3 = "1.8"
ed25519-dalek = "2.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
keccak = { version = "0.1", features = ["asm"] }
polyval = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
tempfile = "3"
num-bigint = "0.4"
