name: Research website

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'docs/VERDICTS.md'
      - 'notes/README.md'
      - 'research/learn_infer_only/**'
  pull_request:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'docs/VERDICTS.md'
      - 'notes/README.md'
      - 'research/learn_infer_only/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public research sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Build from reviewed evidence excerpts
        run: python3 website/build.py
      - name: Check reproducibility, links, and public output
        run: python3 website/build.py --check
      - name: Upload only the generated public directory
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
