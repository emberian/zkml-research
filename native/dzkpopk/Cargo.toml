[package]
name = "dzkpopk"
version = "0.1.0"
edition.workspace = true
description = "Batched hash-based Ligero ZKPoPK for BFV ciphertext batches and the key ceremony; bit-exact port of research/dark_learning_2026_11_06/zkpopk_ligero.py and keygen_ceremony.py."

[dependencies]
pycompat = { path = "../pycompat" }
sha2 = "0.10"
sha3 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rayon = "1.10"
serde_json = "1"
