[package]
name = "ring-browser-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ring-verify"
path = "src/main.rs"

[dependencies]
matvec = { path = "../new_constructions/scaled/matvecmul" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
lto = "thin"
codegen-units = 1

