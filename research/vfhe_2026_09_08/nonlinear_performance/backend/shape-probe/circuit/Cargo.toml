[package]
name = "dregg-circuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Dregg Contributors"]
license = "AGPL-3.0-or-later"
description = "Zero-knowledge proof circuits for dregg authorization token chains"

[dependencies]
