[package]
name = "vfhe-browser-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vfhe-verify"
path = "src/main.rs"

[dependencies]
dregg-circuit = { path = "/Users/ember/dev/breadstuffs/circuit" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[patch."https://github.com/Plonky3/Plonky3"]
p3-fri = { path = "/Users/ember/dev/breadstuffs/vendor/plonky3-fri-82cfad73" }
p3-challenger = { path = "/Users/ember/dev/breadstuffs/vendor/plonky3-challenger-82cfad73" }

[profile.release]
lto = "thin"
codegen-units = 1

