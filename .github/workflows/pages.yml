name: Research website

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'docs/VERDICTS.md'
      - 'notes/README.md'
      - 'research/learn_infer_only/**'
  pull_request:
    branches: [dev]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'docs/VERDICTS.md'
      - 'notes/README.md'
      - 'research/learn_infer_only/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public research sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build from reviewed evidence excerpts
        run: python3 website/build.py
      - name: Check reproducibility, links, and public output
        run: python3 website/build.py --check
      - name: Upload only the generated public directory
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
